name: Sync Strava

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 每天北京时间 00:00

permissions:
  contents: write

concurrency:
  group: strava-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-strava.txt
      - name: Install Strava dependencies
        run: pip install -r requirements-strava.txt
      - name: Sync activities and timelines
        id: sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: python run_page/strava_sync.py
      - name: Preserve encrypted refresh token even if activity sync fails
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/strava-token.enc ]; then
            git add .github/strava-token.enc
            if ! git diff --cached --quiet; then
              git commit -m "chore: preserve encrypted Strava token"
              git pull --rebase --autostash origin main
              git push origin HEAD:main
            fi
          fi
      - name: Save updated workouts
        if: success()
        run: |
          git add run_page/data.db src/static/activities.json
          if [ -d public/data ]; then git add public/data; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: sync Guxiang Strava workouts"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Sync result
        if: success()
        run: |
          python -c "import json; data=json.load(open('src/static/activities.json')); print(f'Synchronized {len(data)} activities.')" >> "$GITHUB_STEP_SUMMARY"
